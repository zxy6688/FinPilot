server {
    listen 80;
    server_name finpilot.cn www.finpilot.cn 43.143.241.109 127.0.0.1;
    root /www/wwwroot/finpilot.cn;
    index index.html;
    client_max_body_size 1m;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
    location = /api { return 308 /api/; }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
    location ~ /\. { deny all; }
    access_log /www/wwwlogs/finpilot.access.log;
    error_log /www/wwwlogs/finpilot.error.log;
}
